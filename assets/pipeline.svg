<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" fill="none" role="img" aria-label="research methodology pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b10"/><stop offset="1" stop-color="#0a1016"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/><stop offset="1" stop-color="#00e0ff"/>
    </linearGradient>
    <style>
      .m{font-family:'DejaVu Sans Mono','JetBrains Mono',Consolas,monospace}
      .node rect{fill:#0d141c;stroke:#1f3340;stroke-width:1.5}
      .node:hover rect{stroke:#00ff9c}
      .lbl{fill:#d6e2ee;font-size:15px;font-weight:700}
      .sub{fill:#6b7280;font-size:11px}
      .idx{fill:#00ff9c;font-size:12px;font-weight:700}
      .wire{stroke:url(#wire);stroke-width:2;stroke-opacity:.35}
      @keyframes glow{0%,100%{opacity:.25}50%{opacity:.9}}
      @media (prefers-reduced-motion: no-preference){
        .n1{animation:glow 4s ease-in-out infinite}
        .n2{animation:glow 4s ease-in-out .66s infinite}
        .n3{animation:glow 4s ease-in-out 1.32s infinite}
        .n4{animation:glow 4s ease-in-out 1.98s infinite}
        .n5{animation:glow 4s ease-in-out 2.64s infinite}
        .n6{animation:glow 4s ease-in-out 3.3s infinite}
      }
    </style>
  </defs>
  <rect width="1200" height="220" fill="url(#pbg)"/>
  <text class="m" x="40" y="42" font-size="13" fill="#5eead4" letter-spacing="3">// METHODOLOGY :: build → break → understand → defend → automate</text>

  <!-- connecting wire -->
  <line class="wire" x1="110" y1="120" x2="1090" y2="120"/>
  <!-- flowing packet -->
  <circle r="5" fill="#00ff9c">
    <animateMotion dur="4s" repeatCount="indefinite" path="M110 120 H1090"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#00e0ff">
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M110 120 H1090"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g class="node m" transform="translate(40,88)">
    <circle class="n1" cx="70" cy="32" r="30" fill="#00ff9c" opacity="0.08"/>
    <rect x="10" y="2" width="120" height="60" rx="10"/>
    <text class="idx" x="22" y="24">01</text>
    <text class="lbl" x="22" y="42">RECON</text>
    <text class="sub" x="22" y="56">map · collect</text>
  </g>
  <g class="node m" transform="translate(210,88)">
    <circle class="n2" cx="70" cy="32" r="30" fill="#00e0ff" opacity="0.08"/>
    <rect x="10" y="2" width="140" height="60" rx="10"/>
    <text class="idx" x="22" y="24">02</text>
    <text class="lbl" x="22" y="42">REVERSE</text>
    <text class="sub" x="22" y="56">disasm · hook</text>
  </g>
  <g class="node m" transform="translate(400,88)">
    <circle class="n3" cx="80" cy="32" r="29" fill="#00ff9c" opacity="0.08"/>
    <rect x="10" y="2" width="160" height="60" rx="10"/>
    <text class="idx" x="22" y="24">03</text>
    <text class="lbl" x="22" y="42">THREAT MODEL</text>
    <text class="sub" x="22" y="56">assumptions · gaps</text>
  </g>
  <g class="node m" transform="translate(610,88)">
    <circle class="n4" cx="80" cy="32" r="29" fill="#00e0ff" opacity="0.08"/>
    <rect x="10" y="2" width="160" height="60" rx="10"/>
    <text class="idx" x="22" y="24">04</text>
    <text class="lbl" x="22" y="42">PoC / EXPLOIT</text>
    <text class="sub" x="22" y="56">prove the weakness</text>
  </g>
  <g class="node m" transform="translate(820,88)">
    <circle class="n5" cx="70" cy="32" r="30" fill="#00ff9c" opacity="0.08"/>
    <rect x="10" y="2" width="140" height="60" rx="10"/>
    <text class="idx" x="22" y="24">05</text>
    <text class="lbl" x="22" y="42">HARDEN</text>
    <text class="sub" x="22" y="56">patch · retest</text>
  </g>
  <g class="node m" transform="translate(1010,88)">
    <circle class="n6" cx="70" cy="32" r="30" fill="#00e0ff" opacity="0.08"/>
    <rect x="10" y="2" width="150" height="60" rx="10"/>
    <text class="idx" x="22" y="24">06</text>
    <text class="lbl" x="22" y="42">AUTOMATE</text>
    <text class="sub" x="22" y="56">agents · pipelines</text>
  </g>

  <text class="m" x="600" y="200" text-anchor="middle" font-size="12" fill="#475569">[ offensive insight, applied to defensive engineering ]</text>
</svg>
