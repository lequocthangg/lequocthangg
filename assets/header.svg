<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none" role="img" aria-label="lequocthangg — Security Research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.5" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#00e0ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#00e0ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'DejaVu Sans Mono','JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace; }
      .name { font-weight: 700; letter-spacing: 2px; }
      /* --- base state: fully readable with zero animation --- */
      @keyframes flick { 0%,97%,100%{opacity:1} 98%{opacity:.25} 99%{opacity:.7} }
      @keyframes gR { 0%,92%,100%{transform:translate(0,0)} 93%{transform:translate(-3px,1px)} 95%{transform:translate(2px,-1px)} 97%{transform:translate(-2px,0)} }
      @keyframes gB { 0%,92%,100%{transform:translate(0,0)} 93%{transform:translate(3px,-1px)} 95%{transform:translate(-2px,1px)} 97%{transform:translate(2px,0)} }
      @keyframes scan { 0%{transform:translateY(-40px)} 100%{transform:translateY(360px)} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes dash { to { stroke-dashoffset:0 } }
      @keyframes caret { 0%{clip-path:inset(0 100% 0 0)} 70%,100%{clip-path:inset(0 0 0 0)} }
      @keyframes dim { 0%,100%{opacity:.35} 50%{opacity:.95} }
      @media (prefers-reduced-motion: no-preference){
        .layerR{animation:gR 6s infinite steps(1)}
        .layerB{animation:gB 6s infinite steps(1)}
        .nameTop{animation:flick 5s infinite}
        .scanline{animation:scan 5.5s linear infinite}
        .cursor{animation:blink 1.05s step-end infinite}
        .trace{stroke-dasharray:640;stroke-dashoffset:640;animation:dash 2.6s ease-out .3s forwards}
        .pulse{animation:dim 2.4s ease-in-out infinite}
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- perspective grid floor -->
  <g stroke="#0fffc1" stroke-opacity="0.08">
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="275" x2="1200" y2="275"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="250" x2="-120" y2="320"/>
    <line x1="350" y1="250" x2="260" y2="320"/>
    <line x1="550" y1="250" x2="500" y2="320"/>
    <line x1="650" y1="250" x2="700" y2="320"/>
    <line x1="850" y1="250" x2="940" y2="320"/>
    <line x1="1050" y1="250" x2="1320" y2="320"/>
  </g>

  <!-- animated top trace (base: fully drawn) -->
  <path class="trace" d="M40 46 H560 M640 46 H1160" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- HUD corner brackets -->
  <g stroke="#00ff9c" stroke-width="2" stroke-opacity="0.8" fill="none">
    <path d="M24 24 h40 M24 24 v40"/>
    <path d="M1176 24 h-40 M1176 24 v40"/>
    <path d="M24 296 h40 M24 296 v-40"/>
    <path d="M1176 296 h-40 M1176 296 v-40"/>
  </g>

  <!-- top status bar -->
  <text class="mono" x="40" y="40" font-size="13" fill="#5eead4" letter-spacing="3">// SEC-RESEARCH NODE</text>
  <g class="pulse"><circle cx="1096" cy="35" r="4" fill="#00ff9c"/></g>
  <text class="mono" x="1112" y="40" font-size="13" fill="#5eead4" letter-spacing="2">ONLINE</text>

  <!-- glitch name -->
  <g transform="translate(600,150)" text-anchor="middle">
    <text class="mono name layerR" font-size="66" fill="#ff2e63" opacity="0.65">lequocthangg</text>
    <text class="mono name layerB" font-size="66" fill="#00e0ff" opacity="0.65">lequocthangg</text>
    <text class="mono name nameTop" font-size="66" fill="#eafff6" filter="url(#soft)">lequocthangg</text>
  </g>

  <!-- typing subtitle (base: fully shown) -->
  <g transform="translate(600,208)" text-anchor="middle">
    <g class="reveal">
      <text class="mono" font-size="20" fill="#9ff">Reverse&#160;Engineering&#160;·&#160;Mobile&#160;Security&#160;·&#160;Anti-Fraud&#160;R&amp;D</text>
    </g>
  </g>

  <!-- command prompt line -->
  <g transform="translate(600,256)" text-anchor="middle">
    <text class="mono" font-size="15">
      <tspan fill="#6b7280">thang@research</tspan><tspan fill="#4ade80">:~$</tspan><tspan fill="#cbd5e1"> ./break_it --to-understand-it</tspan><tspan class="cursor" fill="#00ff9c" dx="4">&#9608;</tspan>
    </text>
  </g>

  <!-- moving scanline -->
  <rect class="scanline" x="0" y="0" width="1200" height="2" fill="#00ff9c" opacity="0.10"/>
</svg>
